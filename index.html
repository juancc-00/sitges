<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archivo de Sitges</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/x-icon" href="/guadana.png">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0a0a0d;
            --bg-surface: #13131a;
            --bg-elevated: #1c1c26;
            --bg-card-hover: #242432;
            --accent: #e50914;
            --accent-soft: rgba(229, 9, 20, 0.14);
            --gold: #f5b301;
            --text-main: #f3f3f7;
            --text-muted: #9494a8;
            --border: rgba(255, 255, 255, 0.08);
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            line-height: 1.5;
            background-image: radial-gradient(circle at 50% 0%, rgba(229, 9, 20, 0.12), transparent 45%);
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(14px);
            background: rgba(10, 10, 13, 0.85);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
        }

        .header-inner {
            max-width: 1240px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }

        .brand-badge {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, #e50914, #8b0000);
            display: grid;
            place-items: center;
            font-family: 'Cinzel', serif;
            font-weight: 800;
            font-size: 1.25rem;
            color: white;
            box-shadow: 0 4px 16px rgba(229, 9, 20, 0.4);
        }

        .brand-title {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 0.05em;
        }

        .brand-subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: block;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.65rem;
        }

        .btn {
            background: var(--bg-elevated);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.55rem 1rem;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            text-decoration: none;
        }

        .btn:hover {
            background: var(--bg-card-hover);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: #ff1f2a;
            border-color: #ff1f2a;
        }

        /* Layout */
        main {
            max-width: 1240px;
            margin: 0 auto;
            padding: 2.2rem 2rem 4rem;
        }

        .section-heading {
            margin-bottom: 1.75rem;
        }

        .section-heading h1 {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.7rem, 3vw, 2.3rem);
            margin-bottom: 0.35rem;
        }

        .section-heading p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Vista 1: Portadas de Ediciones */
        .editions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.75rem;
        }

        .edition-card {
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: transform 0.28s ease, box-shadow 0.28s ease, border-color 0.28s ease;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .edition-card:hover {
            transform: translateY(-6px);
            border-color: rgba(229, 9, 20, 0.5);
            box-shadow: 0 18px 36px rgba(0, 0, 0, 0.6), 0 0 24px rgba(229, 9, 20, 0.15);
        }

        .poster-wrapper {
            position: relative;
            aspect-ratio: 2 / 3;
            width: 100%;
            background: #161621;
            overflow: hidden;
        }

        .poster-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .edition-card:hover .poster-wrapper img {
            transform: scale(1.05);
        }

        .poster-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1.5rem;
            background: radial-gradient(circle at 80% 20%, rgba(229, 9, 20, 0.3), transparent 55%),
                        linear-gradient(160deg, #1b1b29 0%, #0d0d14 100%);
            text-align: center;
        }

        .poster-fallback-top {
            font-size: 0.72rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.6rem;
        }

        .poster-fallback-year {
            font-family: 'Cinzel', serif;
            font-size: 3.1rem;
            font-weight: 800;
            color: var(--text-main);
            text-shadow: 0 4px 20px rgba(229, 9, 20, 0.5);
        }

        .poster-fallback-sub {
            font-size: 0.8rem;
            color: var(--accent);
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .edition-overlay-badge {
            position: absolute;
            top: 0.85rem;
            right: 0.85rem;
            background: rgba(10, 10, 13, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            padding: 0.3rem 0.65rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--gold);
        }

        .edition-info {
            padding: 1.15rem 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-surface);
        }

        .edition-year-label {
            font-family: 'Cinzel', serif;
            font-size: 1.35rem;
            font-weight: 800;
        }

        .edition-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Vista 2: Cabecera de Edición */
        .edition-top-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.75rem;
            padding-bottom: 1.25rem;
            border-bottom: 1px solid var(--border);
        }

        .edition-Banner {
            display: flex;
            align-items: center;
            gap: 1.25rem;
        }

        .mini-poster {
            width: 58px;
            height: 84px;
            border-radius: var(--radius-sm);
            object-fit: cover;
            border: 1px solid var(--border);
            background: var(--bg-elevated);
            flex-shrink: 0;
        }

        /* ==========================================
           NUEVO: CALENDARIO / AGENDA DEL FESTIVAL
           ========================================== */
        .calendar-section {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            margin-bottom: 2.5rem;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
        }

        .calendar-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.25rem;
        }

        .calendar-title-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .calendar-icon-box {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: var(--accent-soft);
            border: 1px solid rgba(229, 9, 20, 0.3);
            display: grid;
            place-items: center;
            color: var(--accent);
            font-size: 1.1rem;
        }

        .calendar-title-group h2 {
            font-family: 'Cinzel', serif;
            font-size: 1.25rem;
            letter-spacing: 0.03em;
        }

        .calendar-title-group p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .day-pills {
            display: flex;
            gap: 0.45rem;
            flex-wrap: wrap;
        }

        .day-pill {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.38rem 0.75rem;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .day-pill:hover {
            color: var(--text-main);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .day-pill.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .calendar-days-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.1rem;
        }

        .day-column {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .day-column-header {
            background: rgba(255, 255, 255, 0.03);
            padding: 0.85rem 1.1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .day-date-badge {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
        }

        .day-number {
            font-family: 'Cinzel', serif;
            font-size: 1.45rem;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1;
        }

        .day-name {
            font-size: 0.82rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--accent);
        }

        .day-count {
            font-size: 0.75rem;
            color: var(--text-muted);
            background: rgba(0, 0, 0, 0.35);
            padding: 0.2rem 0.55rem;
            border-radius: 999px;
        }

        .day-events-list {
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
        }

        .schedule-item {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            border-radius: var(--radius-sm);
            padding: 0.75rem 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .schedule-item:hover {
            transform: translateX(3px);
            border-color: rgba(255, 255, 255, 0.22);
            border-left-color: var(--gold);
        }

        .schedule-time-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.76rem;
        }

        .schedule-time {
            color: var(--gold);
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .schedule-duration {
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 0.1rem 0.45rem;
            border-radius: 4px;
        }

        .schedule-movie-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .schedule-avg-pill {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--gold);
            background: rgba(245, 179, 1, 0.12);
            border: 1px solid rgba(245, 179, 1, 0.3);
            padding: 0.1rem 0.45rem;
            border-radius: 6px;
            white-space: nowrap;
        }

        .schedule-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.15rem;
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .schedule-location {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .schedule-link {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 600;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 0.2rem;
        }

        .schedule-link:hover {
            text-decoration: underline;
        }

        /* Controles de Filtro y Búsqueda de Valoraciones */
        .controls-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-surface);
            padding: 1rem 1.25rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            margin-bottom: 1.75rem;
        }

        .user-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .pill {
            background: var(--bg-elevated);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 0.45rem 0.9rem;
            border-radius: 999px;
            font-size: 0.83rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .pill:hover {
            color: var(--text-main);
        }

        .pill.active {
            background: var(--accent-soft);
            color: #ff5a62;
            border-color: var(--accent);
        }

        .right-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 0.65rem;
            align-items: center;
        }

        .search-input {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.5rem 0.85rem;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            min-width: 210px;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* Secciones de Usuarios */
        .users-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .user-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .user-card-header {
            padding: 1.15rem 1.35rem;
            background: var(--bg-elevated);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-identity {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e50914, #5900ff);
            display: grid;
            place-items: center;
            font-weight: 700;
            font-size: 0.95rem;
            color: white;
        }

        .user-name {
            font-weight: 700;
            font-size: 1.05rem;
        }

        .user-stats {
            text-align: right;
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .user-stats strong {
            color: var(--gold);
            font-size: 0.9rem;
        }

        .movie-list {
            padding: 0.75rem 1.1rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .movie-item {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0.8rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            transition: background 0.15s ease;
        }

        .movie-item:hover {
            background: var(--bg-card-hover);
        }

        .movie-title {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .movie-year {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-left: 0.35rem;
        }

        .movie-extra-meta {
            font-size: 0.74rem;
            color: var(--text-muted);
            margin-top: 0.2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            align-items: center;
        }

        .movie-extra-meta a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 600;
        }

        /* Estrellas */
        .rating-box {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-shrink: 0;
        }

        .stars-row {
            display: inline-flex;
            gap: 2px;
        }

        .star-svg {
            width: 17px;
            height: 17px;
        }

        .rating-number {
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--gold);
            min-width: 28px;
            text-align: right;
        }

        .empty-state {
            text-align: center;
            padding: 2.5rem 1.5rem;
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            border: 1px dashed var(--border);
            color: var(--text-muted);
        }

        .hidden {
            display: none !important;
        }

        /* Estilos para la nueva Tabla de Películas */
        .table-wrapper {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow-x: auto;
        }

        .movies-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            min-width: 720px;
        }

        .movies-table th {
            background: var(--bg-elevated);
            padding: 0.9rem 1rem;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
            transition: color 0.15s ease;
        }

        .movies-table th:hover {
            color: var(--text-main);
        }

        .movies-table th.active-sort {
            color: var(--gold);
        }

        .movies-table td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        .movies-table tbody tr:hover {
            background: var(--bg-card-hover);
        }

        .movie-cell {
            display: flex;
            align-items: center;
            gap: 0.85rem;
        }

        .movie-thumb {
            width: 42px;
            height: 60px;
            border-radius: 6px;
            object-fit: cover;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            flex-shrink: 0;
        }

        @media (max-width: 640px) {
            header, main {
                padding-left: 1rem;
                padding-right: 1rem;
            }
            .users-container, .calendar-days-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Gradiente SVG global para medias estrellas -->
    <svg width="0" height="0" style="position:absolute">
        <defs>
            <linearGradient id="half-star-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="50%" stop-color="#f5b301" />
                <stop offset="50%" stop-color="#323246" />
            </linearGradient>
        </defs>
    </svg>

    <header>
        <div class="header-inner">
        <a class="brand" onclick="showEditionsView()">
                    <img src="pics/sitges.jpg" alt="Logo" style="width: 40px; height: 40px; border-radius: 10px; object-fit: cover; border: 1px solid var(--border);">
                    <div>
                        <span class="brand-title">SITGES</span>
                        <span class="brand-subtitle">Archivo y valoraciones de Juan, Ernesto y Diego</span>
                    </div>
                </a>
            <div class="header-actions">
                <button class="btn" id="backBtn" onclick="showEditionsView()" style="display: none;">
                    ← Todas las ediciones
                </button>
            </div>
        </div>
    </header>

    <main>
        <!-- VISTA 1: PORTADAS POR EDICIÓN -->
        <section id="editionsView">
            <div class="section-heading">
                <h1>Ediciones</h1>
            </div>
            <div id="editionsGrid" class="editions-grid"></div>
        </section>

        <!-- VISTA 2: DETALLE DE EDICIÓN (CALENDARIO ARRIBA + VALORACIONES ABAJO) -->
        <section id="detailView" class="hidden">
            <div class="edition-top-bar">
                <div class="edition-Banner">
                    <img id="detailPoster" class="mini-poster" src="" alt="Poster" onerror="this.style.display='none'">
                    <div>
                        <h1 id="detailTitle" style="font-family: 'Cinzel', serif; font-size: 1.85rem;">Sitges 2026</h1>
                        <p id="detailSubtitle" style="color: var(--text-muted); font-size: 0.9rem;"></p>
                    </div>
                </div>
                <!-- <button class="btn" onclick="showEditionsView()">← Cambiar de edición</button> -->
            </div>

            <!-- BLOQUE SUPERIOR: CALENDARIO DE OCTUBRE -->
            <div class="calendar-section">
                <div class="calendar-header">
                    <div class="calendar-title-group">
                        <!-- <div class="calendar-icon-box">📅</div> -->
                        <div>
                            <h2>Agenda de Pases</h2>
                            <p id="calendarSummaryText">Películas vistas cada día según el calendario</p>
                        </div>
                    </div>
                    <div id="dayPillsContainer" class="day-pills"></div>
                </div>

                <div id="calendarDaysGrid" class="calendar-days-grid"></div>
            </div>

            <!-- BLOQUE INFERIOR: TABLA DE PELÍCULAS -->
            <div class="section-heading" style="margin-bottom: 1rem;">
                <h2 style="font-family: 'Cinzel', serif; font-size: 1.4rem;">Valoraciones</h2>
            </div>

            <div class="controls-bar">
                <button class="btn" id="btnSortChrono" onclick="setSort('chrono')">
                    🕒 Ordenar cronológicamente (según pase)
                </button>
                <div class="right-controls">
                    <input type="text" id="searchInput" class="search-input" placeholder="Buscar película..." oninput="renderRatingsSection()">
                </div>
            </div>

            <div id="detailContent"></div>
        </section>
    </main>

    <script>
        // Datos de respaldo por si se abre el archivo en local sin servidor o aún no existe schedule.json
        const FALLBACK_RATINGS = [
                    {
                        "movie_title": "Carrie",
                        "movie_year": 1980,
                        "sitges_year": 2026,
                        "poster": "pics/carrie.jpg",
                        "rating_juan": 4.5,
                        "rating_ernesto": 4.0,
                        "rating_diego": 5.0
                    },
                    {
                        "movie_title": "The Substance",
                        "movie_year": 2024,
                        "sitges_year": 2026,
                        "rating_juan": 4.0,
                        "rating_ernesto": 5.0,
                        "rating_diego": 4.5
                    },
                    {
                        "movie_title": "Angel's Egg",
                        "movie_year": 1975,
                        "sitges_year": 2025,
                        "rating_juan": 4.5,
                        "rating_ernesto": 5.0,
                        "rating_diego": null
                    }
                ];

        let ratingsData = [];
        let scheduleData = [];
        let currentEdition = null;
        let sortField = 'chrono'; // 'chrono', 'title', 'juan', 'ernesto', 'diego', 'avg'
        let sortAsc = true;

        const FALLBACK_SCHEDULE = [
            {
                "sitges_year": 2026,
                "movie_title": "Carrie",
                "date": "2026-10-09",
                "start_time": "18:30",
                "end_time": "20:08",
                "duration_min": 98,
                "location": "Auditori Meliá Sitges",
                "movie_url": "https://sitgesfilmfestival.com",
                "description": "Proyección especial aniversario"
            },
            {
                "sitges_year": 2026,
                "movie_title": "The Substance",
                "date": "2026-10-09",
                "start_time": "22:15",
                "end_time": "00:35",
                "duration_min": 140,
                "location": "Sala Tramuntana",
                "movie_url": "https://sitgesfilmfestival.com",
                "description": "Sección Oficial Fantàstic"
            },
            {
                "sitges_year": 2025,
                "movie_title": "Angel's Egg",
                "date": "2025-10-11",
                "start_time": "16:00",
                "end_time": "17:15",
                "duration_min": 75,
                "location": "Cinema Prado",
                "movie_url": "https://sitgesfilmfestival.com",
                "description": "Anima't"
            },
            {
                "sitges_year": 2025,
                "movie_title": "Late Night with the Devil",
                "date": "2025-10-12",
                "start_time": "23:00",
                "end_time": "00:33",
                "duration_min": 93,
                "location": "Auditori Meliá Sitges",
                "movie_url": "https://sitgesfilmfestival.com",
                "description": "Sesión golfa"
            }
        ];

        // Cargar data.json y schedule.json automáticamente
        async function loadAllData() {
            try {
                const resRatings = await fetch('data.json', { cache: 'no-store' });
                if (!resRatings.ok) throw new Error();
                ratingsData = await resRatings.json();
            } catch (e) {
                ratingsData = [...FALLBACK_RATINGS];
            }

            try {
                const resSchedule = await fetch('schedule.json', { cache: 'no-store' });
                if (!resSchedule.ok) throw new Error();
                scheduleData = await resSchedule.json();
            } catch (e) {
                scheduleData = [...FALLBACK_SCHEDULE];
            }

            renderEditionsView();
        }

        // Calcula el promedio de una fila ignorando si alguno de los 3 aún no la ha votado (null/undefined)
        function getMovieAverage(movie) {
            const vals = [movie.rating_juan, movie.rating_ernesto, movie.rating_diego]
                .filter(v => v !== null && v !== undefined && v !== '' && !isNaN(Number(v)))
                .map(Number);
            if (vals.length === 0) return null;
            return vals.reduce((a, b) => a + b, 0) / vals.length;
        }

        // CAMBIO 1: Orden cronológico (el más antiguo a la izquierda: a - b)
        function getAvailableYears() {
            const yearsSet = new Set([
                ...ratingsData.map(d => Number(d.sitges_year)),
                ...scheduleData.map(s => Number(s.sitges_year))
            ]);
            return [...yearsSet].filter(Boolean).sort((a, b) => a - b);
        }

        // CAMBIO 2: Mostrar solo el conteo de películas de data.json en la tarjeta
        function renderEditionsView() {
            const grid = document.getElementById('editionsGrid');
            const years = getAvailableYears();

            if (years.length === 0) {
                grid.innerHTML = `<div class="empty-state">No hay registros en <code>data.json</code>.</div>`;
                return;
            }

            grid.innerHTML = years.map(year => {
                const yearMovies = ratingsData.filter(d => Number(d.sitges_year) === year);
                const avgs = yearMovies.map(getMovieAverage).filter(v => v !== null);
                const editionAvg = avgs.length
                    ? (avgs.reduce((acc, v) => acc + v, 0) / avgs.length).toFixed(1)
                    : '—';

                return `
                    <article class="edition-card" onclick="openEdition(${year})">
                        <div class="poster-wrapper">
                            <img src="pics/${year}.jpg" alt="Sitges ${year}"
                                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                            <div class="poster-fallback" style="display: none;">
                                <div class="poster-fallback-top">Festival Internacional de Cinema Fantàstic</div>
                                <div class="poster-fallback-year">${year}</div>
                                <div class="poster-fallback-sub">Sitges Film Log</div>
                            </div>
                            <div class="edition-overlay-badge">★ ${editionAvg}</div>
                        </div>
                        <div class="edition-info">
                            <div>
                                <div class="edition-year-label">Sitges ${year}</div>
                                <div class="edition-meta">${yearMovies.length} ${yearMovies.length === 1 ? 'película' : 'películas'}</div>
                            </div>
                            <span style="color: var(--accent); font-weight: 700;">Ver →</span>
                        </div>
                    </article>
                `;
            }).join('');
        }
        
        function openEdition(year) {
            currentEdition = Number(year);
            sortField = 'chrono';
            sortAsc = true;
            document.getElementById('searchInput').value = '';

            document.getElementById('editionsView').classList.add('hidden');
            document.getElementById('detailView').classList.remove('hidden');
            document.getElementById('backBtn').style.display = 'inline-flex';

            const posterImg = document.getElementById('detailPoster');
            posterImg.style.display = 'block';
            posterImg.src = `pics/${year}.jpg`;

            document.getElementById('detailTitle').textContent = `Sitges ${year}`;

            renderCalendarSection();
            renderRatingsSection();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        function showEditionsView() {
            currentEdition = null;
            document.getElementById('detailView').classList.add('hidden');
            document.getElementById('editionsView').classList.remove('hidden');
            document.getElementById('backBtn').style.display = 'none';
            renderEditionsView();
        }

        // Formatear fecha '2025-10-11' -> { dayNum: '11', weekday: 'Sáb', month: 'Oct' }
        function formatSpanishDate(dateStr) {
            const parts = dateStr.split('-');
            if (parts.length !== 3) return { dayNum: dateStr, weekday: '', month: 'Oct' };
            const dateObj = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
            const weekdays = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
            const months = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
            return {
                dayNum: parts[2],
                weekday: weekdays[dateObj.getDay()],
                month: months[dateObj.getMonth()]
            };
        }

        // CAMBIO 3: Calendario sin filtros por día y adaptado al nuevo formato de data.json
        function renderCalendarSection() {
            const yearEvents = scheduleData
                .filter(e => Number(e.sitges_year) === currentEdition)
                .sort((a, b) => (a.date + a.start_time).localeCompare(b.date + b.start_time));

            const yearMovies = ratingsData.filter(r => Number(r.sitges_year) === currentEdition);
            const gridContainer = document.getElementById('calendarDaysGrid');
            const summaryText = document.getElementById('calendarSummaryText');

            if (yearEvents.length === 0) {
                summaryText.textContent = `No hay pases registrados en schedule.json para octubre de ${currentEdition}.`;
                gridContainer.innerHTML = `<div class="empty-state" style="grid-column: 1 / -1; padding: 1.5rem;">Sin eventos en <code>schedule.json</code> para este año.</div>`;
                return;
            }

            const eventsByDate = {};
            yearEvents.forEach(ev => {
                if (!eventsByDate[ev.date]) eventsByDate[ev.date] = [];
                eventsByDate[ev.date].push(ev);
            });

            const uniqueDates = Object.keys(eventsByDate).sort();
            summaryText.textContent = `${yearEvents.length} sesiones en ${uniqueDates.length} días`;

            gridContainer.innerHTML = uniqueDates.map(dateStr => {
                const dayEvents = eventsByDate[dateStr] || [];
                const dInfo = formatSpanishDate(dateStr);

                const eventsHtml = dayEvents.map(ev => {
                    const matchedMovie = yearMovies.find(
                        m => m.movie_title.toLowerCase().trim() === ev.movie_title.toLowerCase().trim()
                    );
                    const avgVal = matchedMovie ? getMovieAverage(matchedMovie) : null;
                    const avgRating = avgVal !== null ? avgVal.toFixed(1) : null;

                    const timeLabel = ev.end_time ? `${ev.start_time} – ${ev.end_time}` : ev.start_time;
                    const durationLabel = ev.duration_min ? `${ev.duration_min} min` : '';

                    return `
                        <div class="schedule-item">
                            <div class="schedule-time-row">
                                <span class="schedule-time">🕒 ${escapeHtml(timeLabel)}</span>
                                ${durationLabel ? `<span class="schedule-duration">${escapeHtml(durationLabel)}</span>` : ''}
                            </div>
                            <div class="schedule-movie-title">
                                <span>${escapeHtml(ev.movie_title)}</span>
                                ${avgRating ? `<span class="schedule-avg-pill">★ ${avgRating}</span>` : ''}
                            </div>
                            <div class="schedule-meta-row">
                                <span class="schedule-location">📍 ${escapeHtml(ev.location || 'Sala no indicada')}</span>
                                ${ev.movie_url ? `<a class="schedule-link" href="${escapeHtml(ev.movie_url)}" target="_blank" rel="noopener">Ficha ↗</a>` : ''}
                            </div>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="day-column">
                        <div class="day-column-header">
                            <div class="day-date-badge">
                                <span class="day-number">${dInfo.dayNum}</span>
                                <span class="day-name">${dInfo.weekday} · ${dInfo.month}</span>
                            </div>
                            <span class="day-count">${dayEvents.length} ${dayEvents.length === 1 ? 'peli' : 'pelis'}</span>
                        </div>
                        <div class="day-events-list">${eventsHtml}</div>
                    </div>
                `;
            }).join('');
        }

        // Cambiar columna de ordenación
        function setSort(field) {
            if (sortField === field) {
                sortAsc = !sortAsc;
            } else {
                sortField = field;
                // Por defecto: notas de mayor a menor (false), título y cronológico de menor a mayor (true)
                sortAsc = (field === 'title' || field === 'chrono');
            }
            renderRatingsSection();
        }

        // Píldoras de filtro de usuarios
        function renderUserPills() {
            const yearData = ratingsData.filter(d => Number(d.sitges_year) === currentEdition);
            const users = [...new Set(yearData.map(d => d.user))];
            const container = document.getElementById('userPills');

            const pillsHtml = [
                `<button class="pill ${selectedUser === 'ALL' ? 'active' : ''}" onclick="selectUser('ALL')">Todos (${users.length})</button>`,
                ...users.map(u => `<button class="pill ${selectedUser === u ? 'active' : ''}" onclick="selectUser('${escapeHtml(u)}')">${escapeHtml(u)}</button>`)
            ];
            container.innerHTML = pillsHtml.join('');
        }

// CAMBIO 4: Tabla con Portada, Título, Juan, Ernesto, Diego, Promedio y ordenación
        function renderRatingsSection() {
            const container = document.getElementById('detailContent');
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const yearEvents = scheduleData.filter(e => Number(e.sitges_year) === currentEdition);

            // Enriquecer cada película con su promedio y su fecha/hora de pase en schedule.json (para orden cronológico)
            let movies = ratingsData
                .filter(d => Number(d.sitges_year) === currentEdition && (!query || d.movie_title.toLowerCase().includes(query)))
                .map(m => {
                    const sched = yearEvents.find(
                        e => e.movie_title.toLowerCase().trim() === m.movie_title.toLowerCase().trim()
                    );
                    const chronoKey = sched ? `${sched.date} ${sched.start_time || '00:00'}` : '9999-99-99 99:99';
                    return {
                        ...m,
                        _avg: getMovieAverage(m),
                        _chrono: chronoKey,
                        _sched: sched
                    };
                });

            document.getElementById('detailSubtitle').textContent =
                `${movies.length} películas`;

            // Resaltar si el botón cronológico está activo
            const btnChrono = document.getElementById('btnSortChrono');
            if (btnChrono) {
                btnChrono.className = sortField === 'chrono' ? 'btn btn-primary' : 'btn';
                btnChrono.textContent = `Orden cronológico ${sortField === 'chrono' ? (sortAsc ? '↑' : '↓') : ''}`;
            }

            if (movies.length === 0) {
                container.innerHTML = `<div class="empty-state">No hay películas que coincidan con la búsqueda.</div>`;
                return;
            }

            // Ordenar según la columna seleccionada
            movies.sort((a, b) => {
                let valA, valB;
                switch (sortField) {
                    case 'title':
                        return sortAsc
                            ? a.movie_title.localeCompare(b.movie_title)
                            : b.movie_title.localeCompare(a.movie_title);
                    case 'juan':
                        valA = a.rating_juan ?? -1;
                        valB = b.rating_juan ?? -1;
                        break;
                    case 'ernesto':
                        valA = a.rating_ernesto ?? -1;
                        valB = b.rating_ernesto ?? -1;
                        break;
                    case 'diego':
                        valA = a.rating_diego ?? -1;
                        valB = b.rating_diego ?? -1;
                        break;
                    case 'avg':
                        valA = a._avg ?? -1;
                        valB = b._avg ?? -1;
                        break;
                    case 'chrono':
                    default:
                        return sortAsc
                            ? a._chrono.localeCompare(b._chrono)
                            : b._chrono.localeCompare(a._chrono);
                }
                return sortAsc ? valA - valB : valB - valA;
            });

            const arrow = (col) => sortField === col ? (sortAsc ? ' ↑' : ' ↓') : '';
            const activeClass = (col) => sortField === col ? 'active-sort' : '';

            const renderUserCell = (val) => {
                if (val === null || val === undefined || val === '') {
                    return `<span style="color: var(--text-muted);">—</span>`;
                }
                return `
                    <div class="rating-box">
                        ${renderStars(val)}
                        <span class="rating-number">${Number(val).toFixed(1)}</span>
                    </div>
                `;
            };

            container.innerHTML = `
                <div class="table-wrapper">
                    <table class="movies-table">
                        <thead>
                            <tr>
                                <th class="${activeClass('title')}" onclick="setSort('title')">Película${arrow('title')}</th>
                                <th class="${activeClass('juan')}" onclick="setSort('juan')">Juan${arrow('juan')}</th>
                                <th class="${activeClass('ernesto')}" onclick="setSort('ernesto')">Ernesto${arrow('ernesto')}</th>
                                <th class="${activeClass('diego')}" onclick="setSort('diego')">Diego${arrow('diego')}</th>
                                <th class="${activeClass('avg')}" onclick="setSort('avg')">Promedio${arrow('avg')}</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${movies.map(m => {
                                // Busca imagen en m.poster o por defecto en pics/{movie_title}.jpg o el cartel de la edición
                                const posterSrc = m.poster || `pics/${m.sitges_year}.jpg`;
                                const avgText = m._avg !== null ? m._avg.toFixed(2) : '—';
                                return `
                                    <tr>
                                        <td>
                                            <div class="movie-cell">
                                                <img class="movie-thumb" src="${escapeHtml(posterSrc)}" alt=""
                                                    onerror="this.src='pics/${m.sitges_year}.jpg'; this.onerror=null;">
                                                <div>
                                                    <span class="movie-title">${escapeHtml(m.movie_title)}</span>
                                                    <span class="movie-year">(${escapeHtml(String(m.movie_year))})</span>
                                                </div>
                                            </div>
                                        </td>
                                        <td>${renderUserCell(m.rating_juan)}</td>
                                        <td>${renderUserCell(m.rating_ernesto)}</td>
                                        <td>${renderUserCell(m.rating_diego)}</td>
                                        <td>
                                            ${m._avg !== null ? `
                                                <div class="rating-box">
                                                    <strong style="color: var(--gold); font-size: 0.95rem;">★ ${avgText}</strong>
                                                </div>
                                            ` : `<span style="color: var(--text-muted);">—</span>`}
                                        </td>
                                    </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // Generar estrellas sobre 5 (con medias estrellas)
        function renderStars(rating) {
            const val = Math.max(0, Math.min(5, Math.round(Number(rating) * 2) / 2));
            let html = '<span class="stars-row" aria-label="Puntuación ' + val + ' de 5">';
            for (let i = 1; i <= 5; i++) {
                let fill = '#323246';
                if (val >= i) {
                    fill = '#f5b301';
                } else if (val >= i - 0.5) {
                    fill = 'url(#half-star-grad)';
                }
                html += `
                    <svg class="star-svg" viewBox="0 0 24 24">
                        <path fill="${fill}" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
                    </svg>
                `;
            }
            html += '</span>';
            return html;
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        loadAllData();
    </script>
</body>
</html>
